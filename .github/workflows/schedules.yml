name: schedules

# Daily TV schedules: iptv-org's grabber collects ~2 days of listings, then each
# channel's schedule is published as a tiny JSON file on GitHub Pages:
#   https://ken-n7.github.io/reLiveTV/schedules/<channel id>.json
on:
  schedule:
    - cron: '30 1 * * *' # after iptv-org's nightly update (~00:13 UTC)
  workflow_dispatch:

permissions: {} # each job asks only for what it needs

concurrency:
  group: schedules
  cancel-in-progress: false

jobs:
  grab:
    # Runs iptv-org's scrapers (third-party code): read-only token, no secrets.
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iptv-org/epg # latest scrapers on purpose: sites change often
          path: epg
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Channel list (channels reLiveTV can play, on the chosen sites)
        run: python3 tool/epg_channels.py tool/epg_sites.txt channels.xml

      - name: Grab schedules
        working-directory: epg
        continue-on-error: true # some sites fail on some days; keep what worked
        run: |
          npm ci --no-audit --no-fund
          npm run grab --- --channels=../channels.xml --output=../guide.xml --days=2 --maxConnections=5 --timeout=20000

      - name: Check output
        run: |
          test -s guide.xml || { echo "no guide produced"; exit 1; }
          test "$(stat -c %s guide.xml)" -lt 524288000 || { echo "guide unexpectedly large"; exit 1; }
          grep -c '<programme' guide.xml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guide
          path: guide.xml
          retention-days: 1

  publish:
    # Only our own script runs here; this job can deploy Pages and push.
    needs: grab
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guide

      - name: One file per channel
        run: |
          python3 tool/test_epg.py
          python3 tool/split_epg.py guide.xml site 48
          test "$(ls site/schedules | wc -l)" -gt 1

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Monthly keep-alive commit
        # GitHub disables scheduled workflows after 60 days without repository activity.
        if: github.event_name == 'schedule'
        run: |
          [ "$(date -u +%d)" = "01" ] || exit 0
          date -u +%Y-%m-%d > .github/schedules-alive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/schedules-alive
          git commit -m "chore: keep schedule job active" && git push
